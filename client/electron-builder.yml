appId: com.chekssa.app
productName: Chekssa
executableName: Chekssa
directories:
  buildResources: build
publish:
  provider: github
  owner: hodindorian
  repo: Chekssa
  draft: false
files:
  - out/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.utilities
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Utility
