services:
  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      PORT: 4000
      BLOCKED_IPS: "88.190.235.140"
    ports:
      - "0.0.0.0:4000:4000"

  discord-bot:
    build:
      context: ./discord-bot
    restart: unless-stopped
    depends_on:
      - server
    env_file:
      - ./discord-bot/.env
    environment:
      CHEKSSA_SERVER_URL: http://server:4000
